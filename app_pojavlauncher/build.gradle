plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // 1. Get version from environment variable (passed by GitHub Actions or local CLI)
    String envVersion = System.getenv("VERSION_NAME")
    String semVer = (envVersion != null && !envVersion.trim().isEmpty()) ? envVersion.trim().replaceFirst(/^v/, "") : null

    // 2. If not specified in environment, auto-detect from latest git tag matching v*
    if (semVer == null || semVer.isEmpty()) {
        try {
            String latestTag = providers.exec {
                commandLine 'git', 'describe', '--tags', '--match', 'v*', '--abbrev=0'
                ignoreExitValue = true
            }.getStandardOutput().asText.get().trim()
            if (!latestTag.isEmpty()) {
                semVer = latestTag.replaceFirst(/^v/, "")
            }
        } catch (Exception ignored) {}
    }

    // 3. Fallback default
    if (semVer == null || semVer.isEmpty()) {
        semVer = "1.0.0"
    }

    // 4. Get short commit hash
    String commitHash = ""
    try {
        commitHash = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            ignoreExitValue = true
        }.getStandardOutput().asText.get().trim()
    } catch (Exception ignored) {}
    if (commitHash.isEmpty()) commitHash = "git"

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    String mode = isRelease ? "release" : "debug"

    // Result e.g. deepslate-20261113-333f2c3-release-1.1.0
    return "deepslate-" + "${getDate()}" + "-" + commitHash + "-" + mode + "-" + semVer
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 37


    signingConfigs {
        customDebug {
            def storePath = System.getenv("DEBUG_KEYSTORE_FILE") ?: "deepslate.keystore"
            def debugStore = file(storePath)
            if (debugStore.exists()) {
                storeFile debugStore
                storePassword System.getenv("DEBUG_KEYSTORE_PASSWORD") ?: "deepslate"
                keyAlias System.getenv("DEBUG_KEY_ALIAS") ?: "deepslate"
                keyPassword System.getenv("DEBUG_KEY_PASSWORD") ?: "deepslate"
            }
        }
        customRelease {
            def storePath = System.getenv("RELEASE_KEYSTORE_FILE") ?: "deepslate.keystore"
            def releaseStore = file(storePath)
            if (releaseStore.exists()) {
                storeFile releaseStore
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "deepslate"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "deepslate"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "deepslate"
            }
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "org.deepslate.launcher"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 10000000
        versionName getVersionName()
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "Deepslate (Debug)"
            resValue "string", "app_short_name", "Deepslate (Debug)"
            resValue 'string', 'application_package', 'org.deepslate.launcher.debug'
            resValue 'string', 'storageProviderAuthorities', 'org.deepslate.launcher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'org.deepslate.launcher.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customRelease
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "Deepslate"
            resValue "string", "app_short_name", "Deepslate"
            resValue 'string', 'storageProviderAuthorities', 'org.deepslate.launcher.scoped.gamefolder'
            resValue 'string', 'application_package', 'org.deepslate.launcher'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // If you're debugging mesa libs, put them here, android will strip them
            // and not properly link to source files, very smart android studio.
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

