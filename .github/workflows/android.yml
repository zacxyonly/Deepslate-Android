name: Build Deepslate Launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0, or leave empty to auto-detect from latest git tag)'
        required: false
        default: ''
        type: string
      release_type:
        description: 'Release type on GitHub'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
          - draft
      build_type:
        description: 'APK build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - all
      create_release:
        description: 'Publish build output to GitHub Release?'
        required: true
        default: false
        type: boolean
      release_title:
        description: 'Custom release title (optional, leave empty for default)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Resolve Version
        id: resolve_ver
        run: |
          USER_VER="${{ inputs.version }}"
          if [ -z "$USER_VER" ]; then
            LATEST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || true)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.0.0"
            fi
            RESOLVED_VER="$LATEST_TAG"
          else
            if [[ "$USER_VER" != v* ]]; then
              RESOLVED_VER="v${USER_VER}"
            else
              RESOLVED_VER="$USER_VER"
            fi
          fi
          echo "version=${RESOLVED_VER}" >> $GITHUB_OUTPUT
          echo "semver=${RESOLVED_VER#v}" >> $GITHUB_OUTPUT
          echo "Resolved version tag: ${RESOLVED_VER}"
          echo "Resolved semver: ${RESOLVED_VER#v}"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run preparation scripts
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Setup Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app_pojavlauncher/deepslate.keystore
          elif [ ! -f app_pojavlauncher/deepslate.keystore ]; then
            echo "No external release keystore secret found, generating build keystore..."
            keytool -genkeypair -v -keystore app_pojavlauncher/deepslate.keystore -alias deepslate -keyalg RSA -keysize 2048 -validity 10000 -storepass "${RELEASE_KEYSTORE_PASSWORD:-deepslate}" -keypass "${RELEASE_KEYSTORE_PASSWORD:-deepslate}" -dname "CN=Deepslate, OU=Launcher, O=Deepslate, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Build Release APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' }}
        env:
          VERSION_NAME: ${{ steps.resolve_ver.outputs.semver }}
        run: |
          gradle :app_pojavlauncher:assembleRelease
          APK_NAME="Deepslate-Launcher-${{ steps.resolve_ver.outputs.version }}.apk"
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk "out/${APK_NAME}"
          md5sum "out/${APK_NAME}" > "out/${APK_NAME}.md5"

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'debug' }}
        env:
          VERSION_NAME: ${{ steps.resolve_ver.outputs.semver }}
        run: |
          gradle :app_pojavlauncher:assembleDebug
          APK_NAME="Deepslate-Launcher-${{ steps.resolve_ver.outputs.version }}-debug.apk"
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "out/${APK_NAME}"
          md5sum "out/${APK_NAME}" > "out/${APK_NAME}.md5"

      - name: Upload Release Artifact
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: deepslate-release
          path: out/Deepslate-Launcher-${{ steps.resolve_ver.outputs.version }}*

      - name: Upload Debug Artifact
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: deepslate-debug
          path: out/*debug*

      - name: Generate Release Notes & Publish
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.resolve_ver.outputs.version }}"
          TITLE="${{ inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            TITLE="Deepslate Launcher ${TAG_NAME}"
          fi

          echo "## Deepslate Launcher ${TAG_NAME}" > release_notes.md
          echo "" >> release_notes.md
          echo "### What's Changed:" >> release_notes.md
          git log -n 10 --pretty=format:"- %s (\`%h\`)" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Download Assets:" >> release_notes.md
          for f in out/*.apk; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              md5val=$(md5sum "$f" | cut -d' ' -f1)
              echo "- **${fname}** (MD5: \`${md5val}\`)" >> release_notes.md
            fi
          done

          EXTRA_FLAGS=""
          if [ "${{ inputs.release_type }}" = "prerelease" ]; then
            EXTRA_FLAGS="--prerelease"
          elif [ "${{ inputs.release_type }}" = "draft" ]; then
            EXTRA_FLAGS="--draft"
          fi

          # Delete existing release with same tag if it exists to allow re-releasing
          gh release delete "$TAG_NAME" -y 2>/dev/null || true
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true

          # Create release
          gh release create "$TAG_NAME" out/*.apk out/*.md5 \
            --title "$TITLE" \
            --target main \
            --notes-file release_notes.md \
            $EXTRA_FLAGS
